<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Registro</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <header>
        <h1>🐾 Pet Registro</h1>
        <p>Cadastre seu pet e acompanhe suas vacinas.</p>
    </header>

    <main>

        <!-- CADASTRO DO PET -->

        <section>
            <h2>🐶 Cadastrar Pet</h2>

            <form id="formPet">

                <label for="nome">Nome do pet:</label>
                <input type="text" id="nome" required>

                <label for="especie">Espécie:</label>
                <select id="especie" required>
                    <option value="">Selecione</option>
                    <option value="Cachorro">Cachorro</option>
                    <option value="Gato">Gato</option>
                    <option value="Outro">Outro</option>
                </select>

                <label for="raca">Raça:</label>
                <input type="text" id="raca">

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento">

                <button type="submit">Cadastrar Pet</button>

            </form>

        </section>


        <!-- DADOS DO PET -->

        <section>
            <h2>🐾 Meu Pet</h2>

            <div id="listaPets">
                <p>Nenhum pet cadastrado.</p>
            </div>

        </section>


        <!-- CADASTRO DA VACINA -->

        <section>

            <h2>💉 Cadastrar Vacina</h2>

            <form id="formVacina">

                <label for="nomeVacina">Nome da vacina:</label>

                <input 
                    type="text" 
                    id="nomeVacina" 
                    placeholder="Ex.: V10"
                    required
                >

                <label for="dataAplicacao">Data da aplicação:</label>

                <input 
                    type="date" 
                    id="dataAplicacao"
                    required
                >

                <label for="proximaDose">Data da próxima dose:</label>

                <input 
                    type="date" 
                    id="proximaDose"
                    required
                >

                <button type="submit">
                    Cadastrar Vacina
                </button>

            </form>

        </section>


        <!-- REGISTRO DA VACINA -->

        <section>

            <h2>📋 Vacinação</h2>

            <div id="listaVacinas">

                <p>Nenhuma vacina cadastrada.</p>

            </div>

        </section>


        <!-- AVISO -->

        <section id="areaAviso">

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
